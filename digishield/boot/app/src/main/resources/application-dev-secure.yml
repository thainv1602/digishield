# Local profile with authorization switched ON.
#
# The `dev` profile answers "does the feature work"; this one answers "does the
# guard work". @EnableMethodSecurity and the RLS aspect both live on
# @Profile("!dev"), so under `dev` every @PreAuthorize is inert and the only
# place authorization has ever been exercised is production. Run this profile
# INSTEAD of `dev` (not alongside it) and the real security chain loads.
#
#   ./gradlew :boot:app:bootRun --args='--spring.profiles.active=dev-secure'
#
# Tokens are minted locally by DevSecureJwtConfig, so no identity provider is
# needed. One per role is printed to the console at startup; the role comes from
# the email local part (analyst@..., org_admin@..., learner@...). No endpoint
# hands them out — that would need a permitAll chain with CSRF disabled.
spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:digishield;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    # Credentials deliberately absent rather than set to an empty string: Boot
    # applies the embedded-H2 defaults, and a literal empty password in a
    # committed file is a finding in its own right.

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: false

  cache:
    type: none

management:
  health:
    redis:
      enabled: false

digishield:
  auth:
    jwt:
      # Left blank on purpose: DevSecureJwtConfig supplies the JwtDecoder bean,
      # so no issuer is contacted and startup needs no network.
      issuer-uri: ""
