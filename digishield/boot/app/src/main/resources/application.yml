spring:
  application:
    name: digishield

  # Backend-produced user-facing text (notifications, AIDA summaries, intervention
  # messages, dashboard labels) is resolved from classpath:messages[_locale].properties
  # (shipped by shared:tenant-context). Vietnamese is the default/fallback bundle.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Resolve the request locale from Accept-Language (the frontend sends its current
  # language), defaulting to Vietnamese when the header is absent.
  web:
    locale: vi
    locale-resolver: accept-header

  # Virtual threads (Java 21+ / Loom) for high-concurrency I/O.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digishield}
    username: ${DB_USERNAME:digishield}
    password: ${DB_PASSWORD:digishield}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Retire pooled connections before the DB/network drops idle ones (Postgres
      # or the k3s CNI can close idle TCP), and keepalive-ping idle connections so
      # a dead one is detected and replaced instead of surfacing as a warning.
      max-lifetime: ${DB_MAX_LIFETIME:600000} # 10 min (< any idle drop)
      keepalive-time: ${DB_KEEPALIVE:120000} # 2 min idle validation

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  # Redis (cache). Endpoint from env; the dev profile overrides cache.type=none.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
  cache:
    type: ${CACHE_TYPE:redis}

  # Flyway is disabled here: migrations are applied by a dedicated job/profile,
  # not on every application boot. The migration SQL is the single source of
  # truth on the classpath at classpath:db/migration
  # (boot/app/src/main/resources/db/migration).
  flyway:
    enabled: false
    locations: classpath:db/migration

management:
  server:
    # Own port when set, so metrics can be scraped in-cluster without a token
    # while staying off the port the ingress publishes. Empty keeps everything
    # on the main port, which is what local runs want.
    port: ${MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      # Machine-readable logs, so an aggregator can index fields (including the
      # requestId from RequestIdFilter) instead of regex-ing a text line. Empty
      # by default: local runs keep the readable console format, deployments set
      # LOG_FORMAT=ecs.
      console: ${LOG_FORMAT:}

server:
  port: ${SERVER_PORT:8080}

# Notification delivery. Both transports are off by default — notifications are
# persisted but nothing is sent (LoggingNotificationGateway). A RoutingNotificationGateway
# sends EMAIL via SES and SMS via SNS; enable each once the AWS side is ready
# (SES domain verified + ses:SendEmail; SNS sms + sns:Publish, both via IRSA).
digishield:
  # Auth backend login. Off by default → dev StubAuthProvider (static demo tokens,
  # no credential check). When on, /auth/login|refresh|forgot|reset|mfa go through
  # AWS Cognito (CognitoAuthProvider). The app client must allow USER_PASSWORD_AUTH;
  # set the client secret only if the app client has one.
  #
  # Auth: JWT resource server (non-dev profiles). Set the issuer to the OpenID
  # issuer of your IdP — for Amazon Cognito:
  #   https://cognito-idp.<region>.amazonaws.com/<userPoolId>
  # The server fetches that issuer's JWKS and validates signature + issuer + expiry.
  # audience is optional (matched against aud or client_id); roles-claim holds the
  # groups mapped to ROLE_* authorities. When issuer-uri is blank the API is locked
  # down (actuator only) — the permissive local experience is the dev profile.
  auth:
    # Locking a learner out for missing mandatory training. Off by default: it
    # takes real access away on a timer, and there is no self-service way back --
    # a disabled account cannot reach the training it was disabled over, so an
    # admin has to restore it (POST /users/{id}/suspension with suspended=false).
    suspend-overdue-learners:
      enabled: ${AUTH_SUSPEND_OVERDUE_ENABLED:false}
    cognito:
      enabled: ${AUTH_COGNITO_ENABLED:false}
      region: ${AUTH_COGNITO_REGION:}
      client-id: ${AUTH_COGNITO_CLIENT_ID:}
      client-secret: ${AUTH_COGNITO_CLIENT_SECRET:}
      # Pool the admin API administers (not the same switch as `enabled`, which is
      # about signing in: a deployment can log users in through the hosted UI and
      # still want the Users screen to create the accounts).
      user-pool-id: ${AUTH_COGNITO_USER_POOL_ID:}
      directory:
        # On: creating a user on the Users screen also creates the Cognito account
        # (Cognito emails the temporary password) and adds it to the role's group.
        # Off (default) → LoggingUserDirectory: the app row is created and nobody
        # can sign in as it. Needs user-pool-id plus cognito-idp:AdminCreateUser /
        # AdminAddUserToGroup / AdminGetUser on that pool.
        enabled: ${AUTH_COGNITO_DIRECTORY_ENABLED:false}
    jwt:
      issuer-uri: ${AUTH_JWT_ISSUER_URI:}
      audience: ${AUTH_JWT_AUDIENCE:}
      roles-claim: ${AUTH_JWT_ROLES_CLAIM:cognito:groups}
  app:
    # Absolute public base URL of the app (used to build simulation tracking
    # links inside delivered emails/SMS). Blank → relative links (fine for the
    # logging/simulation gateway; set to the real origin for live delivery).
    public-base-url: ${PUBLIC_BASE_URL:}
  learning:
    remediation:
      # Days a learner has to finish training assigned after a simulation click
      # before it counts as late.
      due-days: ${LEARNING_REMEDIATION_DUE_DAYS:3}
    due-sweep:
      # Daily chase for assignments due soon or already past. Scheduler profile
      # only -- a second replica would send the same reminder twice.
      cron: ${LEARNING_DUE_SWEEP_CRON:0 0 8 * * *}
      remind-before-hours: ${LEARNING_DUE_REMIND_BEFORE_HOURS:24}
  notifications:
    email:
      # No default on purpose. The address has to be one verified in SES, which is
      # deployment-specific; a plausible-looking fallback would quietly produce mail
      # that SES rejects or the recipient's provider junks, and nobody would notice.
      # Empty makes the first send fail loudly instead (status FAILED).
      from: ${NOTIFICATIONS_EMAIL_FROM:}
      ses:
        enabled: ${NOTIFICATIONS_SES_ENABLED:false}
    sms:
      # Optional alphanumeric sender id (region/route dependent; blank = none).
      sender-id: ${NOTIFICATIONS_SMS_SENDER_ID:}
      sns:
        enabled: ${NOTIFICATIONS_SNS_ENABLED:false}
  # AI: off by default → deterministic StubAiClient (no token cost). Set true and
  # provide ANTHROPIC_API_KEY to route classify/moderate/generate through Claude.
  # On any Claude error/timeout/malformed response the call degrades to the stub,
  # so the endpoints never 500 because of the model. Models are configurable —
  # cheap Haiku for classify/moderate, Sonnet for generation (bump to
  # claude-sonnet-5 / claude-opus-4-8 via env for higher quality at higher cost).
  ai:
    claude:
      enabled: ${AI_CLAUDE_ENABLED:false}
      # timeout-ms guards the high-frequency synchronous classify/moderate so a slow
      # Claude can't tie up web threads; generate-timeout-ms is looser (Sonnet, longer
      # body). Worst-case block per call = timeout x (max-retries + 1).
      timeout-ms: ${AI_CLAUDE_TIMEOUT_MS:8000}
      generate-timeout-ms: ${AI_CLAUDE_GENERATE_TIMEOUT_MS:30000}
      max-retries: ${AI_CLAUDE_MAX_RETRIES:1}
      model:
        classify: ${AI_CLAUDE_MODEL_CLASSIFY:claude-haiku-4-5}
        moderate: ${AI_CLAUDE_MODEL_MODERATE:claude-haiku-4-5}
        template: ${AI_CLAUDE_MODEL_TEMPLATE:claude-sonnet-4-6}
    # ML: self-hosted phishing classifier (research/service/phishing-ai). When on,
    # classify() hits the fine-tuned models first and escalates to Claude/Stub on
    # low confidence, escalate=true, or any error. moderate()/generate() delegate.
    ml:
      enabled: ${AI_ML_ENABLED:false}
      base-url: ${AI_ML_BASE_URL:http://localhost:8085}
      min-confidence: ${AI_ML_MIN_CONFIDENCE:0.6}
      timeout-ms: ${AI_ML_TIMEOUT_MS:2000}

---
# API run mode
spring:
  config:
    activate:
      on-profile: api

---
# Worker run mode
spring:
  config:
    activate:
      on-profile: worker

---
# Scheduler run mode
spring:
  config:
    activate:
      on-profile: scheduler

---
# Flyway migration run mode (used by the migration job)
spring:
  config:
    activate:
      on-profile: flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Parallel feature branches can merge in an order that leaves a lower
    # version number behind an already-applied higher one (e.g. #116's
    # V2026.07.25.001 merged after #117's V2026.07.25.002). Without this,
    # `validate` fails and the migration job blocks every later rollout.
    # Migrations here are additive and order-independent, so applying a
    # straggler late is safe.
    out-of-order: true
