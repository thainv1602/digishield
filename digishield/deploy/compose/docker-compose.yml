name: digishield

x-app-image: &app-image
  image: digishield/app:0.1.0-SNAPSHOT
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/digishield
  DB_USERNAME: digishield
  DB_PASSWORD: digishield
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_DATA_REDIS_HOST: redis
  # AI (Claude). Off by default → deterministic StubAiClient. To route
  # classify/moderate/generate through Claude, set both on the host before `up`:
  #   AI_CLAUDE_ENABLED=true ANTHROPIC_API_KEY=sk-ant-... docker compose up
  AI_CLAUDE_ENABLED: ${AI_CLAUDE_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Email goes to the fake SES (service `mail`), readable at localhost:8005.
  # Only the endpoint differs from a real deployment; the credentials are
  # dummies the SDK needs in order to sign. For real SES, override these on the
  # host: AWS_ENDPOINT_URL_SESV2= plus a verified NOTIFICATIONS_EMAIL_FROM.
  NOTIFICATIONS_SES_ENABLED: ${NOTIFICATIONS_SES_ENABLED:-true}
  NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-noreply@digishield.local}
  AWS_ENDPOINT_URL_SESV2: ${AWS_ENDPOINT_URL_SESV2-http://mail:8005}
  AWS_REGION: ${AWS_REGION:-ap-southeast-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  # Origin for simulation tracking links. Must be the API: Vite answers every
  # path with the SPA's index.html, so a link there is never tracked.
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

services:
  # Applies the Flyway migrations, then exits — the same split as the Helm
  # chart's Job. Flyway is off in every other profile, so without this the app
  # meets an empty database and dies on `ddl-auto: validate`. It stops itself
  # via DigishieldApplication#flywayMigrateAndExit.
  migrate:
    <<: *app-image
    container_name: digishield-migrate
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: flyway
    command: ["--spring.profiles.active=flyway"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-image
    container_name: digishield-api
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: api
    command: ["--spring.profiles.active=api"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      mail:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-image
    container_name: digishield-worker
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: worker
    command: ["--spring.profiles.active=worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      mail:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app-image
    container_name: digishield-scheduler
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: scheduler
    command: ["--spring.profiles.active=scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    container_name: digishield-postgres
    environment:
      POSTGRES_DB: digishield
      POSTGRES_USER: digishield
      POSTGRES_PASSWORD: digishield
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digishield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digishield-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: digishield-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mail:
    # Fake SES: the SES v2 API plus a web mailbox on the same port (GET / to
    # view, GET /store for JSON). Local only, never part of a deployed stack.
    image: ghcr.io/domdomegg/aws-ses-v2-local:latest
    container_name: digishield-mail
    ports:
      - "8005:8005"

volumes:
  postgres-data:
