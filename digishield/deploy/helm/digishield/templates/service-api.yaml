apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: digishield
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: digishield
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.api.managementPort }}
    # Cluster-internal only: the Ingress routes to `http` above, never here.
    - name: management
      port: {{ .Values.api.managementPort }}
      targetPort: management
    {{- end }}
