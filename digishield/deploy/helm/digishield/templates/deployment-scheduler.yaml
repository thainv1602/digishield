apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-scheduler
  labels:
    app.kubernetes.io/name: digishield
    app.kubernetes.io/component: scheduler
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # Keep at 1 replica so periodic jobs (@Scheduled) don't run in duplicate.
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: digishield
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digishield
        app.kubernetes.io/component: scheduler
    spec:
      # Kubelet-injected Docker-link vars from in-cluster Services (REDIS_PORT=tcp://...)
      # would clobber the app's ${REDIS_PORT:...} placeholders.
      enableServiceLinks: false
      # Every external name the app resolves -- cognito-idp.us-east-1.amazonaws.com
      # among them -- has fewer than five dots, so with the default ndots:5 the
      # resolver tries each search suffix before the name itself. The node's
      # resolv.conf carries "search lan tail761165.ts.net" (Tailscale adds the
      # second), kubelet copies host search domains into every pod, and those two
      # suffixes are forwarded upstream where they time out rather than answering
      # NXDOMAIN. Measured on a pod that inherited them: 10.4s to resolve Cognito,
      # against 0.31s on a pod that did not.
      #
      # ndots:1 tries anything with a dot as an absolute name first. In-cluster
      # names used here (postgres, redis, digishield-api) have no dots
      # and still go through the search list.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--spring.profiles.active={{ .Values.scheduler.profile }}"
          {{- with .Values.api.managementPort }}
          ports:
            - name: management
              containerPort: {{ . }}
          {{- end }}
          env:
            {{- include "digishield.dbEnv" . | nindent 12 }}
            {{- include "digishield.redisEnv" . | nindent 12 }}
            {{- include "digishield.authEnv" . | nindent 12 }}
            {{- include "digishield.aiEnv" . | nindent 12 }}
            {{- include "digishield.loggingEnv" . | nindent 12 }}
            {{- include "digishield.rlsEnv" . | nindent 12 }}
            {{- with $.Values.api.managementPort }}
            # Same management port as the api. #142 wired it there only, so these
            # two exposed nothing to scrape and Prometheus reported dial-refused
            # against a port that was never opened.
            - name: MANAGEMENT_PORT
              value: {{ . | quote }}
            {{- end }}
            {{- include "digishield.notificationsEnv" . | nindent 12 }}
            {{- include "digishield.awsCredsEnv" (dict "ctx" . "directory" false) | nindent 12 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
