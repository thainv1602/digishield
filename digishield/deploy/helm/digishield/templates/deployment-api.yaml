apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: digishield
    app.kubernetes.io/component: api
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: digishield
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digishield
        app.kubernetes.io/component: api
    spec:
      # Kubelet-injected Docker-link vars from in-cluster Services (REDIS_PORT=tcp://...)
      # would clobber the app's ${REDIS_PORT:...} placeholders.
      enableServiceLinks: false
      # The image already runs as uid 1001 (see deploy/docker/Dockerfile); this
      # states it so the kubelet refuses to start the pod if that ever changes
      # silently, rather than quietly running as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # Put the replicas on different nodes. values-jetson.yaml already says "one
      # replica per Jetson", but nothing enforced it: the scheduler happened to
      # split them because it prefers the emptier node, and a rollout was free to
      # land both on the same one. Two replicas that share a node are two replicas
      # that die together, which is the failure the second one exists to survive.
      #
      # ScheduleAnyway, not DoNotSchedule: on a two-node cluster, draining one for
      # maintenance would otherwise leave the second replica Pending rather than
      # merely doubled up. Availability now beats tidiness later.
      #
      # matchLabelKeys pins the count to one revision. Without it the constraint
      # counted the outgoing pods too — during a rolling update they still match
      # the selector — so the scheduler saw one pod per node, called the spread
      # satisfied, and put both new pods wherever else it liked. The first
      # rollout after this constraint landed did exactly that: both replicas
      # ended up on jetson-2, which is what the constraint was added to prevent.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: digishield
              app.kubernetes.io/component: api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--spring.profiles.active={{ .Values.api.profile }}"
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
            {{- if .Values.api.managementPort }}
            # Actuator moves here so an in-cluster scraper can read metrics
            # without a bearer token, while the ingress keeps publishing only
            # the port above. Probes follow it — leaving them on `http` would
            # 404 and no pod would ever become ready.
            - name: management
              containerPort: {{ .Values.api.managementPort }}
            {{- end }}
          env:
            {{- include "digishield.dbEnv" . | nindent 12 }}
            {{- include "digishield.redisEnv" . | nindent 12 }}
            {{- include "digishield.rabbitEnv" . | nindent 12 }}
            {{- include "digishield.authEnv" . | nindent 12 }}
            {{- include "digishield.aiEnv" . | nindent 12 }}
            {{- include "digishield.loggingEnv" . | nindent 12 }}
            {{- include "digishield.rlsEnv" . | nindent 12 }}
            {{- with .Values.api.managementPort }}
            - name: MANAGEMENT_PORT
              value: {{ . | quote }}
            {{- end }}
            {{- include "digishield.notificationsEnv" . | nindent 12 }}
            {{- include "digishield.userDirectoryEnv" . | nindent 12 }}
            {{- include "digishield.awsCredsEnv" (dict "ctx" . "directory" true) | nindent 12 }}
            {{- with .Values.cors.origins }}
            # Browser origins (patterns allowed) the API accepts — needed when
            # the FE is served from a public hostname (tunnel) while TLS is
            # terminated upstream, so requests are no longer seen as same-origin.
            - name: DIGISHIELD_CORS_ALLOWEDORIGINS
              value: {{ . | quote }}
            {{- end }}
          # Boot is slow on arm64 (Jetson): the app takes ~66s to start, plus
          # Flyway migrations and seeders. The startupProbe gives it up to 300s
          # (30 * 10s) to come up; liveness/readiness only begin polling once it
          # succeeds, so no initialDelaySeconds is needed on them.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ if .Values.api.managementPort }}management{{ else }}http{{ end }}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ if .Values.api.managementPort }}management{{ else }}http{{ end }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ if .Values.api.managementPort }}management{{ else }}http{{ end }}
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Boot cannot start without a writable java.io.tmpdir — with the root
          # filesystem read-only and no mount here it fails outright:
          #   Unable to create tempDir. java.io.tmpdir is set to /tmp
          # Verified against this image before the constraint was added.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
