{{- if .Values.ingress.enabled }}
# Public entry point for the API. On AWS the ingressClassName "alb" + the
# AWS Load Balancer Controller provision an internet-facing ALB; its DNS (or a
# Route53 record in front of it) is what CloudFront uses as its /api/* origin
# (Terraform var backend_api_origin_domain).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: digishield
    app.kubernetes.io/component: api
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          {{- if .Values.frontend.enabled }}
          # With the in-cluster frontend, the API keeps /api and everything else
          # serves the SPA (longest prefix wins).
          #
          # /actuator is deliberately not routed. Once actuator moved to the
          # management port it served nothing here but 401 and 404, so the route
          # only invited people to probe it — and publishing it is how metrics
          # ended up readable from the internet in the first place. Health and
          # metrics are reached inside the cluster; kubelet probes go straight to
          # the pod. To check the app is alive from outside, GET /api/v1/qr?data=ok
          # — 200, and it discloses nothing.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: {{ .Values.service.port }}
          # Realtime notifications — the WebSocket handshake lives on the API,
          # not under /api (FE connects to /ws/notifications).
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: {{ .Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: 80
          {{- else }}
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: {{ .Values.service.port }}
          {{- end }}
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
