# Jetson k3s cluster (2x Jetson 8GB, arm64) — deployed by ArgoCD, not `helm install`.
# The ArgoCD Application (deploy/gitops/jetson/apps/digishield.yaml) points at this file.
# Images must be multi-arch (linux/arm64) — built by cd.yml on the arm64 runner.

image:
  repository: ghcr.io/thainv1602/digishield/app
  # jetson-image-tag — rewritten by the cd.yml deploy-jetson job on each main build.
  tag: "latest"
  pullPolicy: Always

# The GHCR package must be public, or create this pull secret on the cluster:
#   kubectl -n digishield create secret docker-registry ghcr-pull ...
# and uncomment:
# imagePullSecrets:
#   - name: ghcr-pull

api:
  # One replica per Jetson; Traefik load-balances across both.
  replicaCount: 2
  # Real-auth mode: `pgdemo` = real Postgres + Flyway; NO `dev`, so the JWT
  # resource server (SecurityConfig) and RLS TenantFilter are active — Cognito
  # tokens are validated and @PreAuthorize/RLS enforced. The app connects as the
  # superuser `digishield`; RlsTenantAspect drops to the non-superuser role
  # `digishield_app` (migration V2026.07.24.001) per request so RLS actually
  # isolates tenants. Requires auth.issuerUri below + a frontend image built with
  # the VITE_COGNITO_* vars.
  #
  # `seed` is deliberately absent. This cluster is production: the demo seeders
  # wrote fixture users, courses and templates straight into the live database on
  # every boot, and they run inside SeedingContext, which switches RLS off while
  # they do it. The seeders are @Profile("dev") now, so this is belt and braces.
  profile: pgdemo
  # Actuator on its own port. #132 shut the public metrics endpoint behind
  # SUPER_ADMIN, which is right for the internet and impossible for a scraper —
  # Prometheus holds no token. Moving it here lets the scraper reach it inside
  # the cluster while the Ingress keeps publishing only 8080.
  managementPort: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  replicaCount: 1

scheduler:
  replicaCount: 1

# React SPA served in-cluster by nginx; the Ingress sends / here and keeps
# /api + /actuator on the API. Image built by cd.yml (multi-arch, no Cognito
# vars → demo login).
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/thainv1602/digishield/frontend
    tag: latest
    pullPolicy: Always

# In-cluster infra (deploy/gitops/jetson/infra), same namespace → short DNS names.
database:
  url: jdbc:postgresql://postgres:5432/digishield
  username: digishield
  existingSecret: digishield-db
  passwordKey: password

redis:
  host: redis
  port: 6379
  tls: false
  existingSecret: ""

rabbitmq:
  host: rabbitmq
  port: 5672
  existingSecret: digishield-rabbit

externalSecrets:
  enabled: false # secrets are created manually on the cluster (see JETSON_SETUP.md)

auth:
  # Cognito user pool issuer — the app validates JWTs against this OIDC issuer.
  issuerUri: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_8nUpkhk0s"
  cognito:
    userPoolId: "us-east-1_8nUpkhk0s" # the pool behind issuerUri, above
    region: "us-east-1"
    directory:
      # Set true once the AWS credentials Secret exists (same one the SES/SNS
      # gateways use — see notifications.aws below) and its IAM principal holds
      # cognito-idp:AdminCreateUser / AdminAddUserToGroup / AdminGetUser on the
      # pool. Until then, users added on the Users screen have no sign-in account
      # and someone has to run admin-create-user by hand.
      #
      # Cognito's built-in mailer sends the invitation, capped at 50 messages a
      # day; point the pool at SES if that ever binds.
      enabled: false

# Public tunnels terminate TLS before Traefik, so the API sees http while the
# browser Origin is https — no longer same-origin. Allow the tunnel hostnames
# (patterns: the trycloudflare subdomain changes on every cloudflared restart).
cors:
  origins: "http://localhost:5173,https://*.ts.net,https://*.trycloudflare.com"

ai:
  claude:
    enabled: false

# Notification delivery (email via AWS SES, SMS via AWS SNS). Kept disabled until
# the AWS side is ready; until then the app persists notifications without
# sending them (LoggingNotificationGateway). To go live:
#   1. Verify the `from` identity in SES and enable SNS SMS in `aws.region`.
#   2. Create the AWS credentials Secret (Jetson k3s has no IRSA):
#        kubectl -n digishield create secret generic digishield-aws \
#          --from-literal=access-key-id=AKIA... \
#          --from-literal=secret-access-key=...
#   3. Flip the `enabled` flags below to true and commit (ArgoCD rolls it out).
# region + existingSecret are pre-set, so only step 2 and the flags remain.
notifications:
  email:
    # A single SES-verified *address*, not a verified domain. digishield.duckdns.org
    # cannot be a sending domain: DuckDNS only serves A/AAAA plus one TXT (which
    # acme.sh uses for the cert), and SES DKIM needs three CNAMEs — so mail from it
    # would carry no DKIM signature at all. Its A record also still points at the
    # retired AWS cluster.
    #
    # utc2.edu.vn publishes neither SPF nor DMARC, so nothing will hard-reject this,
    # but there is no alignment either: expect Gmail to file it under Spam. If the
    # university ever publishes SPF/DMARC with enforcement, this stops working —
    # SES is not authorised to send for their domain.
    from: "nvthai@utc2.edu.vn" # verify this address in SES (it gets a confirmation link)
    ses:
      enabled: false # set true once SES + the Secret are ready
  sms:
    senderId: "" # optional; must be registered with the carrier for VN (+84)
    sns:
      enabled: false # set true once SNS + the Secret are ready
  # Absolute base URL so simulation tracking links in delivered messages resolve.
  publicBaseUrl: "https://ubuntu.tail761165.ts.net"
  aws:
    region: "us-east-1"
    existingSecret: "digishield-aws" # created in step 2; only referenced when enabled
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

service:
  type: ClusterIP
  port: 80

# k3s ships Traefik bound to :80/:443 on every node → API reachable at
# http://<any-jetson-ip>/. Root path so /actuator/* is also reachable in the LAN.
ingress:
  enabled: true
  className: traefik
  path: /
  host: ""
  annotations: {}

# The in-cluster Postgres creates `digishield` via POSTGRES_USER, which initdb
# makes a SUPERUSER — and superusers bypass RLS regardless of FORCE. Every
# workload therefore drops to digishield_app (migration V2026.07.24.001) per
# transaction. Previously this only reached the api pods, because it lived in
# application-pgdemo.yml and worker/scheduler run their own profiles.
rls:
  appRole: "digishield_app"
