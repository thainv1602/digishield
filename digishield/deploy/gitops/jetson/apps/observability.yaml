# Prometheus, Loki, Grafana and their exporters. Split out of digishield-infra,
# which is a sync-wave -1 app for the backing services the Flyway hook needs:
# the monitoring stack has no such ordering constraint, and at 26 of that app's
# 31 resources it buried the four that do.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digishield-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/thainv1602/digishield.git
    targetRevision: main
    path: digishield/deploy/gitops/jetson/infra/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: digishield
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
