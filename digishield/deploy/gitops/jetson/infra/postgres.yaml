# PostgreSQL — single instance on k3s local-path storage. The PV gets node
# affinity on first bind, so the pod sticks to whichever Jetson it first
# scheduled on; that is fine for a 2-node dev cluster.
# Reuses the app's `digishield-db` Secret (key: password) — created manually,
# see JETSON_SETUP.md.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  # Matches the app chart; see its values.yaml for why one is enough.
  revisionHistoryLimit: 1
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        # The container started as root and the entrypoint dropped to postgres,
        # so the data on the volume is already owned by uid 70 — starting as 70
        # directly reaches exactly the same files. Verified by initialising a
        # volume the old way and reopening it read-only as 70: the rows were
        # still there.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        # The socket directory below is an emptyDir, which belongs to root until
        # fsGroup hands it over; without this postgres cannot create its lock
        # file and refuses to start.
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: digishield
            - name: POSTGRES_USER
              value: digishield
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: digishield-db
                  key: password
            # Subdirectory so the volume's lost+found doesn't trip initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # postgres puts its unix socket and lock file here. On a read-only
            # root filesystem the server dies at startup without it:
            #   FATAL: could not create lock file
            #   "/var/run/postgresql/.s.PGSQL.5432.lock": Read-only file system
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "digishield"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
