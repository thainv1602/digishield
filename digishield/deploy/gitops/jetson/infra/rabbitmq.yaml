# RabbitMQ — single node, credentials from the `digishield-rabbit` Secret
# (keys: username/password — the same Secret the app chart reads), created
# manually, see JETSON_SETUP.md. Management UI stays cluster-internal:
#   kubectl -n digishield port-forward svc/rabbitmq 15672:15672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  clusterIP: None
  ports:
    - port: 5672
      name: amqp
    - port: 15672
      name: management
  selector:
    app.kubernetes.io/name: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  # Matches the app chart; see its values.yaml for why one is enough.
  revisionHistoryLimit: 1
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      securityContext:
        # Data on the volume is already owned by uid 100 — the container started
        # as root and the entrypoint dropped to rabbitmq. Starting as 100 reaches
        # the same mnesia directory; verified by initialising a volume the old
        # way and reopening it read-only as 100.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: digishield-rabbit
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: digishield-rabbit
                  key: password
          volumeMounts:
            # Three directories outside the data volume, each found by running
            # the image read-only until it stopped complaining. The log one is
            # not optional — without it the broker never boots:
            #   BOOT FAILED: failed to open log file at
            #   '/var/log/rabbitmq/rabbit@…log', reason: read-only file system
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/rabbitmq/conf.d
            - name: logs
              mountPath: /var/log/rabbitmq
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
