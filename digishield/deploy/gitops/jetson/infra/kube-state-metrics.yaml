# kube-state-metrics — the state of the Kubernetes objects themselves.
#
# node-exporter answers "is the board healthy" and actuator answers "is the JVM
# healthy". Neither answers "is a pod stuck in CrashLoopBackOff", "did a
# Deployment fail to reach its desired replicas" or "is a PVC nearly full" —
# those live in the API server, and this is what reads them out.
#
# The upstream ClusterRole (examples/standard/cluster-role.yaml) grants
# list+watch on **secrets and configmaps**. list on Secrets returns their
# values, not just their names, so shipping it as published would hand every
# secret in the cluster to a metrics exporter — including grafana-admin and the
# Tailscale operator's OAuth credentials, which the rest of this repo goes out
# of its way to keep out of git and out of chat logs. Both are dropped here,
# and --resources is pinned to the matching list so kube-state-metrics does not
# spend startup retrying collectors it has no permission for.
#
# Also dropped as irrelevant on this cluster: certificatesigningrequests,
# webhook configurations, volumeattachments, replicationcontrollers, HPAs,
# PDBs, leases and RBAC objects. Re-add both the rule and the --resources entry
# together if any of them ever start being used.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: digishield
  labels:
    app.kubernetes.io/name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
rules:
  # Read-only throughout: list and watch, never get on an individual object,
  # never create, never write.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: digishield
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: digishield
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  ports:
    - port: 8080
      name: http-metrics
    - port: 8081
      name: telemetry
  selector:
    app.kubernetes.io/name: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: digishield
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  # One superseded revision kept, matching the app chart. Kubernetes'
  # default of 10 fills the ArgoCD tree with empty rows; rollback here is
  # a git revert that ArgoCD syncs, so the history is only ever read.
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            # Holds no state: everything is rebuilt from watches on restart.
            readOnlyRootFilesystem: true
          args:
            # Kept in step with the ClusterRole above — a resource listed here
            # without a matching rule just produces permission errors on loop.
            - --resources=cronjobs,daemonsets,deployments,endpointslices,ingresses,jobs,limitranges,namespaces,nodes,persistentvolumeclaims,persistentvolumes,pods,replicasets,resourcequotas,services,statefulsets,storageclasses
          ports:
            - containerPort: 8080
              name: http-metrics
            - containerPort: 8081
              name: telemetry
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
