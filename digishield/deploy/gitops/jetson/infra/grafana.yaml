# Grafana — somewhere to look at the metrics and logs now that both are kept.
#
# Deliberately not published through the Ingress. Everything this cluster exposes
# goes to the public internet through the Tailscale Funnel, and that is how
# /actuator/prometheus ended up readable by anyone (#132). Reach it instead with:
#
#   kubectl -n digishield port-forward svc/grafana 3000:3000
#
# An Ingress can be added later if it is wanted, as a deliberate decision rather
# than a side effect of the default.
#
# The admin password is NOT in git, and is not chosen by hand either. Same shape
# as ArgoCD's initial admin secret: generate a random one into a Secret once, then
# read it back with kubectl when you need it.
#
#   # generate (once)
#   kubectl -n digishield create secret generic grafana-admin \
#     --from-literal=admin-password="$(head -c 18 /dev/urandom | base64 | tr -d /+=)"
#
#   # read it back, the way you would ArgoCD's
#   kubectl -n digishield get secret grafana-admin \
#     -o jsonpath='{.data.admin-password}' | base64 -d; echo
#
#   # rotate
#   kubectl -n digishield delete secret grafana-admin && <generate again>
#   kubectl -n digishield rollout restart deploy/grafana
#
# A generated value beats a chosen one: nobody has to invent a password under
# time pressure, and it never passes through a chat log, a ticket or a commit.
# Without the secret the pod stays Pending with a clear reason — the failure mode
# to want. A committed default is how a repo ends up handing out access to anyone
# who reads it, exactly as COGNITO_MANUAL_SETUP.md did.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  ports:
    - port: 3000
      name: http
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 472
        runAsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            # State lives on the mounted volume; nothing legitimately writes to
            # the image layers. /tmp is mounted separately below.
            readOnlyRootFilesystem: true
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # No sign-up, and no anonymous access even though this is only
            # reachable through a port-forward today.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 320Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
