# Grafana — somewhere to look at the metrics and logs now that both are kept.
#
# Deliberately not published through the Traefik Ingress. Everything Traefik
# serves on this cluster goes to the public internet through the Tailscale
# Funnel on ubuntu.tail761165.ts.net, and that is how /actuator/prometheus
# ended up readable by anyone (#132).
#
# It is published to the tailnet instead, through the Tailscale operator (see
# apps/tailscale.yaml). That is the deliberate decision this comment used to
# defer: reachable from any machine on the tailnet without a kubectl, and from
# nowhere else.
#
#   https://grafana.<tailnet>.ts.net
#
# The port-forward still works and stays the fallback when the operator is down
# or the tailnet is not joined:
#
#   kubectl -n digishield port-forward svc/grafana 3000:3000
#
# The admin password is NOT in git, and is not chosen by hand either. Same shape
# as ArgoCD's initial admin secret: generate a random one into a Secret once, then
# read it back with kubectl when you need it.
#
#   # generate (once)
#   kubectl -n digishield create secret generic grafana-admin \
#     --from-literal=admin-password="$(head -c 18 /dev/urandom | base64 | tr -d /+=)"
#
#   # read it back, the way you would ArgoCD's
#   kubectl -n digishield get secret grafana-admin \
#     -o jsonpath='{.data.admin-password}' | base64 -d; echo
#
#   # rotate
#   kubectl -n digishield delete secret grafana-admin && <generate again>
#   kubectl -n digishield rollout restart deploy/grafana
#
# A generated value beats a chosen one: nobody has to invent a password under
# time pressure, and it never passes through a chat log, a ticket or a commit.
# Without the secret the pod stays Pending with a clear reason — the failure mode
# to want. A committed default is how a repo ends up handing out access to anyone
# who reads it, exactly as COGNITO_MANUAL_SETUP.md did.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: digishield
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # The uids are pinned. Left unset, Grafana generates a random one per
      # install, and a provisioned dashboard referencing it would point at a
      # datasource that does not exist on any other cluster (or after the PVC is
      # recreated). grafana-dashboards.yaml refers to these two names.
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: digishield
  labels:
    app.kubernetes.io/name: grafana
spec:
  ports:
    - port: 3000
      name: http
  selector:
    app.kubernetes.io/name: grafana
---
# Tailnet-only Ingress. `ingressClassName: tailscale` routes around Traefik
# altogether: the operator gives this Service its own tailnet device and its own
# Let's Encrypt certificate, served on https://grafana.<tailnet>.ts.net.
#
# The hostname comes from tls.hosts[0], NOT from a rules[].host — that is the
# operator's convention, and the name is the device name on the tailnet.
#
# No `tailscale.com/funnel: "true"` annotation, so this is NOT on the public
# internet. Adding that annotation is the one-line change that would put Grafana
# — and with it every metric and every application log Loki holds — in front of
# a single generated admin password with no MFA. Do not add it casually.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: digishield
  labels:
    app.kubernetes.io/name: grafana
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: grafana
      port:
        number: 3000
  tls:
    - hosts:
        - grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: digishield
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        # Above Trivy's 10000 threshold. The image ships as uid 472, but Grafana
        # only needs to write /var/lib/grafana, and fsGroup makes the volume
        # writable for whatever uid we pick — verified on the cluster rather
        # than assumed.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            # State lives on the mounted volume; nothing legitimately writes to
            # the image layers. /tmp is mounted separately below.
            readOnlyRootFilesystem: true
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # No sign-up, and no anonymous access. The tailnet is the first gate
            # and the admin password is the second; neither is worth giving up.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # GF_SERVER_ROOT_URL is left unset on purpose. Grafana serves fine
            # at the root of any host without it, and pinning it to the ts.net
            # name would make the port-forward fallback emit links back to a
            # host the browser may not be able to reach.
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 320Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # Not under /var/lib/grafana: that path is the PVC, and a ConfigMap
            # mounted inside it would be shadowed by the volume.
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: tmp
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: digishield
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
