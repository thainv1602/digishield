# Redis — cache only, no persistence, no auth (matches docker-compose local).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  # Matches the app chart; see its values.yaml for why one is enough.
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # Redis does not read the container limit, so without maxmemory it
          # keeps accepting writes until the cgroup kills it. Capped below the
          # 256Mi limit, with room for the process itself, and told to drop the
          # least recently used key instead of failing the write -- everything
          # in here is a cache and can be recomputed.
          args:
            - "--maxmemory"
            - "200mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # redis writes its RDB snapshot to /data. The image declares it as a
          # VOLUME, which Docker honours by inventing one and Kubernetes ignores
          # entirely — so on a read-only root filesystem there is nowhere to
          # write unless we say so. This cache is not persisted; the volume only
          # has to exist.
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
