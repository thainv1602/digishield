# Provisioned Grafana dashboards. Kept in git rather than clicked together in
# the UI: a dashboard built by hand lives only in the PVC, so it cannot be
# reviewed, cannot be restored onto a fresh cluster, and quietly diverges from
# whatever the app actually exposes.
#
# The trade is that the dashboard is READ-ONLY in the UI ("editable": false, and
# allowUiUpdates is off below). To change a panel, edit the JSON here. To
# experiment, use Explore, or copy the dashboard via Dashboard settings -> Save
# as, which lands an editable copy in the PVC without fighting provisioning.
#
# Every PromQL expression in the dashboard below was run against the live
# Prometheus on the Jetson cluster before being committed, so none of them are
# guesses about metric or label names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: digishield
  labels:
    app.kubernetes.io/name: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: digishield
        orgId: 1
        folder: DigiShield
        type: file
        # Provisioning owns these dashboards: UI edits are discarded on restart,
        # and deleting one from git removes it from Grafana.
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          # Matches the ConfigMap mount in grafana.yaml, deliberately outside
          # /var/lib/grafana so the PVC does not shadow it.
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
