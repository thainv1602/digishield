  digishield-cluster-health.json: |
    {
      "uid": "digishield-cluster-health",
      "title": "DigiShield - Cluster Health",
      "description": "Node hardware and Kubernetes object state for the Jetson cluster, from node-exporter and kube-state-metrics. Provisioned from git - edits made in the UI are discarded on restart.",
      "tags": [
        "digishield",
        "provisioned"
      ],
      "timezone": "browser",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Cluster",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Nodes ready",
          "id": 2,
          "description": "Expect 2. One is the k3s server, one the agent.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "instant": true,
              "datasource": {
