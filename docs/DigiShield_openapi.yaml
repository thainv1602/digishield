    patch:
      tags: [Tenancy]
      summary: Enable/disable feature flag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureFlag' }
      responses:
        '200': { description: OK }

  /tenants/{id}/usage:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Billing]
      summary: Tenant usage metering data
      parameters:
        - in: query
