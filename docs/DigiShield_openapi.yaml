    get:
      tags: [Watchlist]
      summary: List suspicious recipient accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountWatchEntry' }
    post:
      tags: [Watchlist]
      summary: Add/sync suspicious accounts (SIMO/NAPAS/A05)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountWatchEntry' }
      responses:
        '201': { description: Created }

  /account-watchlist/check:
    get:
      tags: [Watchlist]
      summary: Quick lookup of account/phone number at the money-transfer point
      parameters:
        - in: query
          name: value
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [bank_account, phone, wallet] }
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  inWatchlist: { type: boolean }
                  riskLevel:
                    type: string
                    enum: [WATCH, HIGH, CONFIRMED]
                    nullable: true
                    description: >-
                      The enum constant's own name, upper case. Null rather
                      than a "none" value when the account is not listed.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, default: 1, minimum: 1 }
    Size:
      in: query
      name: size
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    Problem:
      description: Error (RFC 7807)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }

  schemas:
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [super_admin, org_admin, manager, content_editor, analyst, learner] }
        status: { type: string, enum: [pending, active, suspended, disabled] }
        department: { type: string }
        locale: { type: string, example: vi }
        phone: { type: string }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          deprecated: true
          description: >-
            The same value as riskScore. UserView carries both spellings, so
            both reach the client; prefer riskScore.

    UserInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string }
        department_id: { type: string, format: uuid }
        locale: { type: string }

    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rule_json:
          type: object
          description: Dynamic conditions for the smart group
          example: { risk_score_gte: 70, department: "ke-toan" }
        member_count: { type: integer }

    Course:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        level: { type: string, enum: [basic, beginner, intermediate, advanced] }
        lang: { type: string, example: vi }
        durationMin: { type: integer }
        lessonCount: { type: integer }
        progress: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string }

    Enrollment:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        courseTitle: { type: string }
        status: { type: string, enum: [assigned, in_progress, completed, overdue] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        score: { type: integer }
        due_at: { type: string, format: date-time }

    SimTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [email, sms, qr, usb, voice, zalo, teams, slack] }
        subject: { type: string }
        body_ref: { type: string }
        body: { type: string }
        body_format: { type: string, enum: [text, html] }
        category: { type: string }
        logo_url: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        difficulty: { type: string, enum: [easy, medium, hard] }
        status: { type: string, enum: [draft, approved] }

    SimCampaignInput:
      type: object
      required: [channel, templateId]
      properties:
        channel: { type: string, enum: [email, sms, qr, usb, voice, zalo, teams, slack] }
        templateId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }

    SimCampaign:
      allOf:
        - $ref: '#/components/schemas/SimCampaignInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            org_id: { type: string, format: uuid }
            status: { type: string, enum: [draft, scheduled, running, completed, cancelled] }

    SimEvent:
      type: object
      description: Payload recording one tracked interaction with a campaign.
      required: [campaignId, userId, action]
      properties:
        campaignId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        action: { type: string, enum: [DELIVERED, OPEN, CLICK, SUBMIT, REPORT] }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        reporter: { type: string }
        subject: { type: string }
        sender: { type: string }
        payload: { type: string }
        aiLabel: { type: string, enum: [clean, spam, threat] }
        aiConfidence: { type: number, format: float }
        reasoning: { type: string }
        blacklistMatch: { type: boolean }
        status: { type: string, enum: [submitted, triaging, confirmed, quarantined, dismissed] }
        channel: { type: string, enum: [email, sms] }
        reportedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the report was submitted. Null on rows written before the
            column existed. ageLabel is derived from this, but a relative label
            cannot be grouped, sorted or plotted — anything charting reports
            over time needs the instant.
        ageLabel: { type: string, description: Human-readable age, e.g. "2 gio truoc" }
    BlacklistEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [domain, url, email, ip, phone, hash] }
        value: { type: string }
        source: { type: string, example: NCSC }

    BlacklistEntryInput:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [domain, url, email, ip, phone, hash] }
        value: { type: string }
        source: { type: string, example: NCSC }

    RiskScore:
      type: object
      properties:
        scope: { type: string, enum: [user, dept, org] }
        scope_id: { type: string, format: uuid }
        value: { type: integer, minimum: 0, maximum: 100 }
        computed_at: { type: string, format: date-time }

    Badge:
      type: object
      description: A badge as awarded to a user; BadgeCatalog is the definition.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        iconRef: { type: string }
        earned: { type: boolean }
        awardedAt: { type: string, format: date-time }

    PointsEntry:
      type: object
      properties:
        points: { type: integer }
        reason: { type: string }
        ts: { type: string, format: date-time }

    Assessment:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [knowledge, culture, placement] }
        anonymous: { type: boolean }
        questions_json: { type: object }
        period: { type: string }

    Certificate:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        serial: { type: string }
        pdf_ref: { type: string }
        issued_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string, enum: [reminder, alert, system] }
        channel: { type: string, enum: [in_app, email, sms] }
        status: { type: string, enum: [scheduled, sent, read, failed] }
        title: { type: string }
        body: { type: string }
        scheduledAt: { type: string, format: date-time }

    NotificationInput:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        type: { type: string, enum: [reminder, alert, system] }
        channel: { type: string, enum: [in_app, email, sms] }
        payload: { type: object }
        status: { type: string, enum: [scheduled, sent, read, failed] }
        scheduled_at: { type: string, format: date-time }

    ThreatIntel:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { type: string, example: NCSC }
        raw_payload: { type: string }
        converted_template_id: { type: string, format: uuid }
        collected_at: { type: string, format: date-time }

    CoachingPage:
      type: object
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        content_ref: { type: string }
        signals_json: { type: object, description: Recognizable warning signs to display }

    CompliancePolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        framework: { type: string, example: ISO27001 }
        dueRule: { type: string, example: "annual" }
        mandatory: { type: boolean }
        completionPct: { type: integer, minimum: 0, maximum: 100 }

    CompliancePolicyInput:
      type: object
      required: [name, framework]
      properties:
        name: { type: string }
        framework: { type: string, example: ISO27001 }
        due_rule: { type: string, example: "annual" }
        mandatory: { type: boolean }
        mapping_json: { type: object }
        course_id: { type: string, format: uuid }

    InterventionDecision:
      type: object
      properties:
        decision: { type: string, enum: [allow, warn, pause, block] }
        signals: { type: array, items: { type: string }, example: [on_call, new_payee, watchlist_hit] }
        message: { type: string, description: Warning/educational content to display }

    InterventionEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        signals: { type: array, items: { type: string } }
        decision: { type: string, enum: [allow, warn, pause, block] }
        ts: { type: string, format: date-time }

    AccountWatchEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [bank_account, phone, wallet] }
        value: { type: string }
        risk_level: { type: string, enum: [watch, high, confirmed] }
        source: { type: string, example: SIMO }
        added_at: { type: string, format: date-time }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        tier: { type: string, enum: [pool, bridge, silo] }
        dataRegion: { type: string, example: vn }
        status: { type: string, enum: [provisioning, active, suspended, deactivated] }
        userCount: { type: integer }
        domain: { type: string }

    TenantUpdate:
      type: object
      properties:
        name: { type: string }
        tier: { type: string, enum: [pool, bridge, silo] }
        status: { type: string, enum: [provisioning, active, suspended, deactivated] }
        data_region: { type: string, example: vn }

    TenantSettings:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        branding: { type: object, description: logo, colors, subdomain }
        policy: { type: object, description: risk thresholds, mandatory training }
        default_locale: { type: string, example: vi }

    FeatureFlag:
      type: object
      properties:
        key: { type: string, example: deepfake_sim }
        enabled: { type: boolean }

    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, enum: [edu, business, gov] }
        limits: { type: object, description: seats, emails, ai_calls }
        features: { type: object }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        status: { type: string, enum: [trial, active, past_due, canceled] }
        renews_at: { type: string, format: date }

    Me:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [super_admin, org_admin, manager, content_editor, analyst, learner] }
        name: { type: string }
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        ip: { type: string }
        severity: { type: string }
    SimCampaignDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel: { type: string }
        status: { type: string }
        templateId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        funnel:
          type: object
          properties:
            delivered: { type: integer, format: int64 }
            open: { type: integer, format: int64 }
            click: { type: integer, format: int64 }
            submit: { type: integer, format: int64 }
            report: { type: integer, format: int64 }
        results:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              department: { type: string }
              action: { type: string }
              learningStatus: { type: string }
    Dashboard:
      type: object
      properties:
        risk_score: { type: integer }
        risk_delta: { type: integer }
        phish_prone_pct: { type: number, format: double }
        phish_prone_pct_delta: { type: number, format: double }
        industry_avg_pct: { type: number, format: double }
        training_completion: { type: integer }
        open_alerts:
          type: object
          properties:
            total: { type: integer }
            critical: { type: integer }
            warning: { type: integer }
        risk_trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              value: { type: integer }
        benchmarks:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: number, format: double }
              strong: { type: boolean }
        departments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              score: { type: integer }
        recent_reports:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              who: { type: string }
              age: { type: string }
              ai_label: { type: string }
    UsageMetering:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        metric: { type: string, enum: [email_sent, sms_sent, ai_call, storage] }
        value: { type: integer }
        period: { type: string, example: 2026-06 }

    Attachment:
      type: object
      properties:
        name: { type: string }
        mime: { type: string }

    SimTemplateUpsert:
      type: object
      properties:
        channel: { type: string, enum: [email, sms, qr, usb, voice, zalo, teams, slack] }
        subject: { type: string }
        body: { type: string }
        body_format: { type: string, enum: [text, html] }
        category: { type: string }
        logo_url: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        difficulty: { type: string, enum: [easy, medium, hard] }
        approved: { type: boolean }

    AidaRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string }
        scope_id: { type: string, format: uuid }
        status: { type: string }
        summary: { type: string }
        created_at: { type: string, format: date-time }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
        name: { type: string }
        locale: { type: string, example: vi }

    LessonSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        courseTitle: { type: string }
        title: { type: string }
        durationMin: { type: integer }
        questionCount: { type: integer }

    Lesson:
      type: object
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        exampleTitle: { type: string }
        example: { type: string }
        closing: { type: string }
        durationMin: { type: integer }
        progressPct: { type: integer, minimum: 0, maximum: 100 }
        checkpoints:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              state: { type: string }

    Quiz:
      type: object
      properties:
        lessonId: { type: string, format: uuid }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              q: { type: string }
              options:
                type: array
                items: { type: string }
              correct: { type: integer, description: Index into options }
              explain: { type: string }

    PointRule:
      type: object
      properties:
        action: { type: string }
        label: { type: string }
        points: { type: integer }

    BadgeCatalog:
      type: object
      description: A badge definition, as distinct from Badge (one awarded to a user).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        iconRef: { type: string }
        criteria_type: { type: string }
        criteria_threshold: { type: integer }

    MemberCount:
      type: object
      properties:
        member_count: { type: integer }

    BusinessThresholds:
      type: object
      properties:
        risk_alert_score: { type: integer, minimum: 0, maximum: 100 }
        pass_score_pct: { type: integer, minimum: 0, maximum: 100 }
        min_campaigns_per_quarter: { type: integer, minimum: 0 }

    ScimConfig:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        idpName: { type: string }
        connected: { type: boolean }
        idpTenantId: { type: string }
        clientId: { type: string }
        scimEndpoint: { type: string }
        lastSyncAt: { type: string, format: date-time }
        syncedUserCount: { type: integer }
        syncErrorCount: { type: integer }
        syncStatus: { type: string }

    UserReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        payload: { type: string }
        channel: { type: string }
        status: { type: string }
        reportedAt: { type: string, format: date-time }
        ageLabel: { type: string }

    MailDomainCheck:
      type: object
      properties:
        domain: { type: string }
        mx: { $ref: '#/components/schemas/DnsRecordCheck' }
        spf: { $ref: '#/components/schemas/DnsRecordCheck' }
        dmarc: { $ref: '#/components/schemas/DnsRecordCheck' }

    DnsRecordCheck:
      type: object
      properties:
        ok: { type: boolean }
        records:
          type: array
          items: { type: string }
        note: { type: string }

    SmsTestResult:
      type: object
      properties:
        delivered: { type: boolean }
        detail: { type: string }

    SendResult:
      type: object
      properties:
        campaignId: { type: string, format: uuid }
        status: { type: string }
        recipientCount: { type: integer }
        recipients:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              token: { type: string, format: uuid }
              trackUrl: { type: string }
