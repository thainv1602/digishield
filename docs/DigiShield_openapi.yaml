        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointRule' }

  /gamification/badges/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [Gamification]
      summary: Delete a badge definition
      responses:
        '204': { description: Deleted }

  /gamification/badges:
    get:
      tags: [Gamification]
      summary: Badge catalogue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
