openapi: 3.0.3
info:
  title: DigiShield (Digital Shield) API
  version: 1.0.0
  description: >
    Platform API for prevention, training & alerting against online scams in cyberspace.
    Multi-tenant, RBAC, scoped by org_id in the JWT. Errors follow RFC 7807.
  contact:
    name: DigiShield Engineering
servers:
  - url: https://api.digishield.vn/api/v1
    description: Production
  - url: https://staging-api.digishield.vn/api/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Groups
  - name: Learning
  - name: Simulation
  - name: Reports
  - name: Alerts
  - name: Blacklist
  - name: Analytics
  - name: AI
  - name: Gamification
  - name: Assessment
  - name: Certificate
  - name: Provisioning
  - name: Notification
  - name: ThreatFlip
  - name: Coaching
  - name: Compliance
  - name: Interception
  - name: Watchlist
  - name: Tenancy
  - name: Billing

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Internal login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/profile:
    get:
      tags: [Auth]
      summary: Current user's editable profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                locale: { type: string, example: vi }
                email: { type: string, format: email }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }

  /lessons/{id}/quiz:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Learning]
      summary: Quiz attached to a lesson
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quiz' }

  /lessons:
    get:
      tags: [Learning]
      summary: List lessons across the catalogue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LessonSummary' }
    post:
      tags: [Learning]
      summary: Create a lesson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lesson' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }

  /lessons/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Learning]
      summary: Lesson detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
    put:
      tags: [Learning]
      summary: Replace a lesson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lesson' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
    delete:
      tags: [Learning]
      summary: Delete a lesson
      responses:
        '204': { description: Deleted }

  /auth/sso/callback:
    post:
      tags: [Auth]
      summary: SSO callback (SAML/OAuth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org, assertion]
              properties:
                org: { type: string }
                assertion: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current signed-in principal
      description: >
        Resolves the caller from the bearer token. The tenant returned here is the
        one every later call is scoped to.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: No resolvable principal
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset (send email link)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Email sent if the account exists }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, description: Token from email }
                new_password: { type: string, format: password }
      responses:
        '200': { description: Password changed successfully }
        '400': { $ref: '#/components/responses/Problem' }

  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Initialize MFA (generate secret + QR for authenticator)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string }
                  qr_svg: { type: string }

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Confirm MFA activation with the first code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: MFA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }

  /auth/mfa/challenge:
    post:
      tags: [Auth]
      summary: Verify MFA code during login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string, description: Temporary token after the password step }
                code: { type: string }
                trust_device: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - in: query
          name: department_id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Users]
      summary: User details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Users]
      summary: Update user/role
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    delete:
      tags: [Users]
      summary: Remove a user and their sign-in account
      description: >-
        Deletes the user and the account they sign in with, so removing them
        from the list also removes their access. Refused when the target
        outranks the caller, or is the caller.
      responses:
        '204':
          description: Deleted
        '403':
          description: Target outranks the caller, or is the caller

  /groups:
    get:
      tags: [Groups]
      summary: List groups (including smart groups)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
    post:
      tags: [Groups]
      summary: Create group (rule_json for smart group)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Group' }
      responses:
        '201': { description: Created }

  /groups/{id}/evaluate:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Groups]
      summary: Re-evaluate smart group members
      responses:
        '200':
          description: Member count after evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count: { type: integer }

  /groups/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Groups]
      summary: Update a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Group' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
    delete:
      tags: [Groups]
      summary: Delete a group
      responses:
        '204': { description: Deleted }

  /groups/{id}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - in: path
        name: userId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Groups]
      summary: Remove a member from a group
      responses:
        '200':
          description: Member count after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCount' }

  /groups/{id}/members:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Groups]
      summary: Member ids of a group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
    post:
      tags: [Groups]
      summary: Add a member to a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Member count after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCount' }

  /courses:
    get:
      tags: [Learning]
      summary: Course library
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
    post:
      tags: [Learning]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Course' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }

  /courses/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Learning]
      summary: Replace a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Course' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
    delete:
      tags: [Learning]
      summary: Delete a course
      responses:
        '204': { description: Deleted }

  /enrollments:
    get:
      tags: [Learning]
      summary: List enrollments
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [assigned, in_progress, completed, overdue] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Enrollment' }
    post:
      tags: [Learning]
      summary: Enroll user in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, courseId]
              properties:
                userId: { type: string, format: uuid }
                courseId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }

  /enrollments/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Learning]
      summary: Update enrollment progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                progress: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }

  /sim/campaigns:
    get:
      tags: [Simulation]
      summary: List simulation campaigns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SimCampaign' }
    post:
      tags: [Simulation]
      summary: Create simulation campaign
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimCampaignInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimCampaign' }

  /sim/campaigns/{id}:
    get:
      tags: [Simulation]
      summary: Campaign detail with funnel and per-recipient outcome
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimCampaignDetail' }
        '404':
          description: Not found

  /sim/campaigns/{id}/send:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Simulation]
      summary: Send a campaign to selected recipients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Per-recipient tracking tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendResult' }
  /sim/track/{token}:
    get:
      tags: [Simulation]
      summary: Beacon endpoint for a simulated lure
      description: >
        Opened by the recipient, not by the application. Records the interaction and
        returns a coaching page. Responds with HTML, not JSON, and is deliberately
        unauthenticated - the token is the credential.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Coaching page
          content:
            text/html:
              schema: { type: string }

  /qr:
    get:
      tags: [Simulation]
      summary: Render a QR code as SVG
      description: >-
        Public by design: a QR lure is photographed off a poster, so the image
        must render before the viewer has any session.
      security: []
      parameters:
        - in: query
          name: data
          required: true
          schema: { type: string }
        - in: query
          name: size
          schema: { type: integer, default: 220 }
        - in: query
          name: quiet
          schema: { type: integer, default: 2 }
      responses:
        '200':
          description: SVG image
          content:
            image/svg+xml:
              schema: { type: string }
  /sim/events:
    post:
      tags: [Simulation]
      summary: Record simulation event (tracking)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimEvent' }
      responses:
        '202': { description: Accepted }

  /reports/phishing:
    post:
      tags: [Reports]
      summary: User submits a suspicious email/SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                userId: { type: string, format: uuid }
                payload: { type: string, description: Email content/headers/link }
                channel: { type: string, enum: [email, sms] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
    get:
      tags: [Reports]
      summary: Report queue (Analyst)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [submitted, triaging, confirmed, quarantined, dismissed] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Report' }

  /reports/phishing/mine/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reports]
      summary: Reports submitted by one learner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserReport' }

  /reports/phishing/{id}/triage:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Reports]
      summary: Analyst triages / processes a report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [confirm_threat, quarantine, dismiss]
                  description: >-
                    quarantine records a threat the analyst is holding: the
                    report is labelled THREAT but no confirmation event is
                    emitted, so the reporter is rewarded once, when the verdict
                    becomes final. An unknown value is rejected with 400.
                add_to_blacklist:
                  type: boolean
                  default: false
                  description: >-
                    Also block the reported sender (as an EMAIL indicator).
                    Rejected with 400 alongside dismiss, and rejected when the
                    report carries no sender, so a block is never reported as
                    done when nothing was blocked. Re-triaging the same sender
                    does not create a duplicate entry.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }

  /alerts/broadcast:
    post:
      tags: [Alerts]
      summary: Broadcast alert to the entire organization (WebSocket push)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [severity, message]
              properties:
                severity: { type: string, enum: [info, warning, critical] }
                message: { type: string }
      responses:
        '202': { description: Accepted }

  /blacklist:
    get:
      tags: [Blacklist]
      summary: List blacklist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlacklistEntry' }
    post:
      tags: [Blacklist]
      summary: Add/sync blacklist (NCSC)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlacklistEntryInput' }
      responses:
        '201': { description: Created }

  /blacklist/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [Blacklist]
      summary: Remove a blacklist entry
      responses:
        '204': { description: Deleted }

  /analytics/risk:
    get:
      tags: [Analytics]
      summary: Risk score by scope
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [user, dept, org] }
        - in: query
          name: scope_id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskScore' }

  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Aggregated dashboard payload
      description: >
        KPIs, 90-day trend, departments and recent reports in one call, so the
        dashboard does not need to fan out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /analytics/benchmark:
    get:
      tags: [Analytics]
      summary: Benchmark phish-prone rate against the industry
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_phish_prone_pct: { type: number }
                  industry_avg_pct: { type: number }

  /ai/templates/generate:
    post:
      tags: [AI]
      summary: AI generates a simulated phishing template (pending approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, industry]
              properties:
                channel: { type: string, enum: [email, sms] }
                industry: { type: string, example: banking }
                season: { type: string, example: summer }
      responses:
        '200':
          description: Template draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimTemplate' }

  /ai/templates:
    get:
      tags: [AI]
      summary: List simulation templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SimTemplate' }
    post:
      tags: [AI]
      summary: Create a simulation template (draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimTemplateUpsert' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimTemplate' }

  /ai/templates/{id}/submit:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [AI]
      summary: Submit a template for approval
      description: >-
        Moves the template out of draft so a reviewer other than its author can
        approve it (business rule BR-4).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimTemplate' }

  /ai/templates/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [AI]
      summary: Update a simulation template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimTemplateUpsert' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimTemplate' }
    delete:
      tags: [AI]
      summary: Delete a simulation template
      responses:
        '204': { description: Deleted }

  /ai/classify:
    post:
      tags: [AI]
      summary: AI classifies a reported email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string }
      responses:
        '200':
          description: Classification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  label: { type: string, enum: [clean, spam, threat] }
                  confidence: { type: number, format: float }
                  reason: { type: string }

  /tenants:
    get:
      tags: [Tenancy]
      summary: List tenants (Super Admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
    post:
      tags: [Tenancy]
      summary: Create a new tenant, and its first administrator
      description: >-
        Users are always created in the caller's own tenant, so adminEmail is the
        only moment an account can be placed inside the new one. Omit it and the
        organisation exists with nobody able to sign in. Provisioning the admin
        happens in the same transaction: if it fails, the tenant is not created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                tier:
                  type: string
                  enum: [pool, bridge, silo]
                dataRegion:
                  type: string
                adminEmail:
                  type: string
                  format: email
                  description: first administrator; receives the invitation email
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }

  /tenants/{id}/impersonate:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Tenancy]
      summary: Enter a tenant as a platform operator
      description: >-
        Writes the entry into that tenant's own audit log, so impersonation
        leaves a trace the customer can see (business rule BR-6).
      responses:
        '204': { description: Recorded }

  /tenants/{id}/thresholds:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Tenancy]
      summary: Business thresholds of a tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessThresholds' }
    patch:
      tags: [Tenancy]
      summary: Update business thresholds
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessThresholds' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessThresholds' }

  /tenants/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Tenancy]
      summary: Tenant details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
    patch:
      tags: [Tenancy]
      summary: Update tenant (tier, status, data region)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }

  /tenants/{id}/settings:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Tenancy]
      summary: Tenant configuration (branding, policy, language)
      description: >-
        A tenant with no identity provider connected still answers 200, with
        connected=false and syncStatus=never. 404 means the tenant itself does
        not exist.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScimConfig' }
        '404':
          description: No such tenant
    patch:
      tags: [Tenancy]
      summary: Update tenant configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantSettings' }
      responses:
        '200': { description: OK }

  /settings/mail-domain/verify:
    get:
      tags: [Tenancy]
      summary: Check MX, SPF and DMARC of a sending domain
      parameters:
        - in: query
          name: domain
          required: true
          schema: { type: string, example: digishield.vn }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDomainCheck' }

  /super/scim:
    get:
