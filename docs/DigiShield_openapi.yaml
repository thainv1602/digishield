        - in: query
          name: scope
          schema: { type: string, enum: [org, department, user] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  compliantPct: { type: number }
                  compliantCount: { type: integer }
                  totalCount: { type: integer }
                  overdueCount: { type: integer }
                  policyCount: { type: integer }
                  completedCount: { type: integer }
                  dueSoonCount: { type: integer }

  /interventions/evaluate:
    post:
      tags: [Interception]
      summary: Real-time risk assessment at the transaction point (active-call detection)
      description: >
        Returns an alert decision (allow/warn/pause/block) based on a combination of signals.
        DigiShield does NOT execute the transaction — it only returns a decision for the calling app to handle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, amount, destAccount]
              properties:
                userId: { type: string, format: uuid }
                amount: { type: number }
                destAccount: { type: string }
                onCall: { type: boolean, description: User is currently on a call }
                newPayee: { type: boolean, description: First-time payee }
      responses:
        '200':
          description: Intervention decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterventionDecision' }

  /interventions:
    get:
      tags: [Interception]
      summary: Intervention log (SOC/reporting)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
