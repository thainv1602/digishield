      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompliancePolicy' }
    post:
      tags: [Compliance]
      summary: Create compliance policy (mandatory training)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompliancePolicyInput' }
