# Trivy suppressions. Every entry is scoped to a single path and carries the
# reason it is not a defect — an unscoped or unexplained ignore is how a scanner
# stops being worth running.
#
# Nothing else in this repo is suppressed. The pre-existing HIGH findings on
# loki, postgres, rabbitmq and redis (KSV-0014, KSV-0118) are real and are left
# visible on purpose; they are not this file's business to hide.
misconfigurations:
  - id: KSV-0009
    paths:
      - "digishield/deploy/gitops/jetson/infra/node-exporter.yaml"
    statement: >-
      node-exporter cannot do its job without hostNetwork. Its whole purpose is
      to report the node's network counters, connection states and interface
      statistics; inside a pod network namespace it would faithfully report the
      pod's, which is not a number anyone wants. Accepted for this DaemonSet
      only. It is mitigated by everything around it: no hostPID, no hostPort,
      runAsNonRoot as uid 65534, all capabilities dropped, readOnlyRootFilesystem
      and seccomp RuntimeDefault, and every host path mounted read-only.

  - id: KSV-0121
    paths:
      - "digishield/deploy/gitops/jetson/infra/node-exporter.yaml"
    statement: >-
      The /proc, /sys and / mounts are the metric source, not a side effect —
      node-exporter reads the kernel's counters straight out of procfs and
      sysfs, and needs the root filesystem to report disk usage for the real
      disks rather than the container's overlay. All three are mounted
      readOnly, so the container can observe the host and change nothing on it.

  - id: KSV-0023
    paths:
      - "digishield/deploy/gitops/jetson/infra/node-exporter.yaml"
    statement: >-
      The same three read-only host mounts as KSV-0121, seen from the volume
      side rather than the container side. There is no way to export a node's
      metrics without reading the node's filesystems.

  - id: KSV-0125
    paths:
      - "digishield/deploy/gitops/jetson/infra/node-exporter.yaml"
      - "digishield/deploy/gitops/jetson/infra/kube-state-metrics.yaml"
    statement: >-
      The rule wants images from a configured allowlist of registries, which
      this repo has not defined, so every upstream image fails it by default.
      These two come from the projects that publish them — prom/node-exporter
      from the Prometheus organisation, and registry.k8s.io for
      kube-state-metrics, which is the Kubernetes project's own registry. Both
      are pinned to exact version tags. If an allowlist is ever configured,
      delete this entry rather than extending it.
